<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>오늘의 할 일 | Daymark</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #778293;
      --line: #e8edf2;
      --blue: #2864dc;
      --blue-dark: #174fbe;
      --blue-wash: #eef4ff;
      --green: #25855a;
      --surface: #ffffff;
      --page: #f7f9fc;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .page-shell {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      margin-bottom: 76px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .01em;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
    }

    .brand-mark svg { width: 16px; height: 16px; }

    .top-date {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    main {
      padding: 0 24px;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 12px 40px rgb(35 54 80 / 5%);
    }

    .intro { padding: 38px 0 28px; }

    .eyebrow {
      margin: 0 0 11px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .13em;
    }

    h1 {
      margin: 0;
      font-family: "Georgia", "Malgun Gothic", serif;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .intro-date {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 0 20px;
      border-top: 1px solid var(--line);
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
    }

    .summary-count {
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-count strong { color: var(--blue); }

    .progress-track {
      height: 4px;
      overflow: hidden;
      border-radius: 99px;
      background: #edf0f4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width 180ms ease;
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 25px 0 19px;
    }

    .add-input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 15px;
      border: 1px solid #dce3ec;
      border-radius: 7px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .add-input::placeholder { color: #9aa4b2; }
    .add-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgb(40 100 220 / 12%); }

    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 92px;
      height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--blue-dark); }
    .add-button:active { transform: translateY(1px); }
    .add-button svg { width: 16px; height: 16px; }

    .task-list {
      min-height: 170px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .task-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 13px;
      min-height: 62px;
      border-top: 1px solid var(--line);
      animation: arrive 180ms ease both;
    }

    .task-check {
      width: 19px;
      height: 19px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .task-text {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
    }

    .task-item.is-complete .task-text {
      color: #98a1ad;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: #8993a1;
      background: transparent;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease;
    }

    .delete-button:hover { color: #c24145; background: #fff1f1; }
    .delete-button svg { width: 17px; height: 17px; }

    .empty-state {
      display: grid;
      min-height: 170px;
      align-content: center;
      justify-items: center;
      gap: 9px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 38px;
      height: 38px;
      margin-bottom: 3px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      background: var(--blue-wash);
    }

    .empty-mark svg { width: 19px; height: 19px; }
    .empty-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 650; }
    .empty-copy { margin: 0; font-size: 12px; }

    .main-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 0 19px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .completion-note { color: var(--green); font-weight: 650; }

    :focus-visible { outline: 3px solid rgb(40 100 220 / 35%); outline-offset: 3px; }
    .add-input:focus-visible { outline: none; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .page-shell { width: min(100% - 28px, 460px); padding-top: 17px; }
      .topbar { margin-bottom: 48px; }
      main { padding: 0 18px; border-radius: 9px; }
      .intro { padding-top: 29px; }
      h1 { font-size: 29px; }
      .add-form { gap: 8px; }
      .add-button { min-width: 48px; padding: 0 13px; }
      .add-button .button-label { display: none; }
      .task-item { gap: 10px; }
      .main-footer { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand" aria-label="Daymark">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none"><path d="m4.5 10.4 3.6 3.4 7.4-7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>daymark</span>
      </div>
      <time class="top-date" id="topDate"></time>
    </header>

    <main>
      <section class="intro" aria-labelledby="pageTitle">
        <p class="eyebrow">TODAY, AT YOUR PACE</p>
        <h1 id="pageTitle">오늘의 할 일</h1>
        <p class="intro-date" id="fullDate"></p>
      </section>

      <section aria-label="완료 현황">
        <div class="summary">
          <span class="summary-label">오늘의 진행 상황</span>
          <span class="summary-count" id="summaryCount" aria-live="polite"><strong>0</strong> / 0 완료</span>
        </div>
        <div class="progress-track" id="progressTrack" role="progressbar" aria-label="할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <form class="add-form" id="addForm">
        <label class="sr-only" for="taskInput" hidden>새 할 일</label>
        <input class="add-input" id="taskInput" name="task" type="text" maxlength="180" placeholder="예: 주간 회의 자료 정리" autocomplete="off" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="button-label">추가</span>
        </button>
      </form>

      <ul class="task-list" id="taskList" aria-label="오늘의 할 일 목록"></ul>
      <div class="empty-state" id="emptyState" hidden>
        <span class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none"><path d="m4.5 10.4 3.6 3.4 7.4-7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <p class="empty-title">오늘은 이만큼이면 충분해요.</p>
        <p class="empty-copy">새로운 할 일을 추가해 보세요.</p>
      </div>

      <footer class="main-footer">
        <span id="remainingCount">할 일을 추가해 보세요</span>
        <span class="completion-note" id="completionNote" hidden>오늘의 할 일을 모두 마쳤어요</span>
      </footer>
    </main>
  </div>

  <script>
    (() => {
      const storageKey = "daymark.tasks.v1";
      const taskList = document.querySelector("#taskList");
      const emptyState = document.querySelector("#emptyState");
      const addForm = document.querySelector("#addForm");
      const taskInput = document.querySelector("#taskInput");
      const summaryCount = document.querySelector("#summaryCount");
      const progressTrack = document.querySelector("#progressTrack");
      const progressFill = document.querySelector("#progressFill");
      const remainingCount = document.querySelector("#remainingCount");
      const completionNote = document.querySelector("#completionNote");
      let tasks = readTasks();

      function readTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return Array.isArray(saved)
            ? saved.filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
            : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(tasks));
        } catch {
          remainingCount.textContent = "저장 공간을 사용할 수 없습니다";
        }
      }

      function createTaskElement(task) {
        const item = document.createElement("li");
        item.className = `task-item${task.completed ? " is-complete" : ""}`;
        item.dataset.taskId = task.id;

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `${task.text} 완료 여부`);

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", `할 일 삭제: ${task.text}`);
        deleteButton.title = "삭제";
        deleteButton.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m-6.5 0 .7 9.2a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9l.7-9.2M8.2 9v4.4m3.6-4.4v4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        item.append(checkbox, text, deleteButton);
        return item;
      }

      function render() {
        const completed = tasks.filter((task) => task.completed).length;
        const total = tasks.length;
        const percent = total ? Math.round((completed / total) * 100) : 0;

        taskList.replaceChildren(...tasks.map(createTaskElement));
        taskList.hidden = total === 0;
        emptyState.hidden = total !== 0;
        summaryCount.innerHTML = `<strong>${completed}</strong> / ${total} 완료`;
        progressFill.style.width = `${percent}%`;
        progressTrack.setAttribute("aria-valuenow", String(percent));
        remainingCount.textContent = total === 0
          ? "할 일을 추가해 보세요"
          : completed === total
            ? "모든 할 일을 완료했습니다"
            : `남은 할 일 ${total - completed}개`;
        completionNote.hidden = total === 0 || completed !== total;
      }

      function persistAndRender() {
        saveTasks();
        render();
      }

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) {
          taskInput.focus();
          return;
        }
        tasks.push({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, text, completed: false });
        taskInput.value = "";
        persistAndRender();
        taskInput.focus();
      });

      taskList.addEventListener("change", (event) => {
        if (!event.target.matches(".task-check")) return;
        const item = event.target.closest(".task-item");
        const task = tasks.find((entry) => entry.id === item.dataset.taskId);
        if (!task) return;
        task.completed = event.target.checked;
        persistAndRender();
      });

      taskList.addEventListener("click", (event) => {
        const button = event.target.closest(".delete-button");
        if (!button) return;
        const item = button.closest(".task-item");
        tasks = tasks.filter((task) => task.id !== item.dataset.taskId);
        persistAndRender();
      });

      const today = new Date();
      document.querySelector("#topDate").textContent = new Intl.DateTimeFormat("ko-KR", { month: "long", day: "numeric" }).format(today);
      document.querySelector("#fullDate").textContent = new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(today);
      render();
    })();
  </script>
</body>
</html>
